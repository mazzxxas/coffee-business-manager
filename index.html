<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b2e1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Coffee Manager"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Coffee Business Manager</title>
<style>
body{font-family:Arial;margin:0;background:#f6f1e8;color:#30251d}header{background:#4b2e1f;color:#fff;padding:16px;text-align:center}nav{display:flex;overflow:auto;background:#fff}nav button{padding:12px;border:0;background:#fff;white-space:nowrap}nav button.active{background:#ead8c2}main{max-width:1000px;margin:auto;padding:16px}.sec{display:none}.show{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card,.form{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px}.value{font-size:22px;font-weight:bold}input,select{width:100%;padding:9px;margin:5px 0 10px;border:1px solid #ccc;border-radius:7px}label{font-size:13px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.primary{background:#4b2e1f;color:#fff;border:0;padding:10px 14px;border-radius:7px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#ead8c2}
</style></head><body>
<header><h1>☕ Coffee Business Manager</h1><small>V1 — Buying • Processing • Sales • Expenses</small><div style="margin-top:10px"><button id="installBtn" class="primary" style="display:none;background:#fff;color:#4b2e1f">📲 Install on phone</button></div></header><nav id="nav"></nav><main>
<div id="dashboard" class="sec show"><h2>Dashboard</h2><div class="cards">
<div class="card">Cherry bought<div class="value" id="ch">0 kg</div></div><div class="card">Money spent<div class="value" id="sp">KSh 0</div></div><div class="card">Parchment<div class="value" id="pa">0 kg</div></div><div class="card">Sales<div class="value" id="sa">KSh 0</div></div><div class="card">Expenses<div class="value" id="ex">KSh 0</div></div><div class="card">Net<div class="value" id="net">KSh 0</div></div></div><p>First record: 1 Oct 2026 — 15 kg cherry at KSh 100/kg = KSh 1,500.</p></div>
<div id="buying" class="sec"><h2>🛒 Buying</h2><div class="form"><div class="grid"><label>Date<input id="bd" type="date"></label><label>Seller/source<input id="bs"></label><label>Type<select id="bt"><option>Cherry</option><option>Parchment</option></select></label><label>Kg<input id="bk" type="number"></label><label>Price/kg<input id="bp" type="number"></label></div><button class="primary" onclick="buy()">Add purchase</button></div><div id="btbl"></div></div>
<div id="processing" class="sec"><h2>🌱 Processing</h2><div class="form"><div class="grid"><label>Date<input id="pd" type="date"></label><label>Batch<input id="pb"></label><label>Cherry kg<input id="pc" type="number"></label><label>Parchment kg<input id="pp" type="number"></label><label>Sunk kg<input id="ps" type="number"></label><label>Float/lower grade kg<input id="pf" type="number"></label><label>Moisture %<input id="pm" type="number"></label><label>Worker bonus/kg<input id="pr" type="number" value="2.5"></label></div><button class="primary" onclick="proc()">Add batch</button></div><div id="ptbl"></div></div>
<div id="sales" class="sec"><h2>💰 Sales</h2><div class="form"><div class="grid"><label>Date<input id="sd" type="date"></label><label>Buyer<input id="sb"></label><label>Grade<select id="sg"><option>AA</option><option>AB</option><option>PB</option><option>C</option><option>Other</option></select></label><label>Kg<input id="sk" type="number"></label><label>Price/kg<input id="sq" type="number"></label><label>Deductions<input id="sx" type="number" value="0"></label></div><button class="primary" onclick="sale()">Add sale</button></div><div id="stbl"></div></div>
<div id="expenses" class="sec"><h2>💵 Expenses</h2><div class="form"><div class="grid"><label>Date<input id="ed" type="date"></label><label>Category<select id="ec"><option>Transport</option><option>Labour</option><option>Pulping</option><option>Drying</option><option>Milling</option><option>Packaging</option><option>Water</option><option>Other</option></select></label><label>Amount<input id="ea" type="number"></label><label>Notes<input id="en"></label></div><button class="primary" onclick="expense()">Add expense</button></div><div id="etbl"></div></div>
<div id="reports" class="sec"><h2>📊 Reports</h2><div class="card" id="report"></div><button class="primary" onclick="backup()">Export backup</button></div>
</main><script>
let d=JSON.parse(localStorage.getItem("coffeeV1")||'{"buy":[],"proc":[],"sale":[],"exp":[]}');const K="coffeeV1";
const money=n=>"KSh "+(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
function save(){localStorage.setItem(K,JSON.stringify(d));render()}
function buy(){let k=+bk.value,p=+bp.value;if(!k||!p)return alert("Enter kg and price");d.buy.push({date:bd.value,seller:bs.value,type:bt.value,kg:k,price:p,total:k*p});save()}
function proc(){let k=+pc.value;if(!k)return alert("Enter cherry kg");let p=+pp.value||0,r=+pr.value||0;d.proc.push({date:pd.value,batch:pb.value,cherry:k,parchment:p,sunk:+ps.value||0,float:+pf.value||0,moisture:+pm.value||0,bonus:k*r});save()}
function sale(){let k=+sk.value,p=+sq.value;if(!k||!p)return alert("Enter kg and price");d.sale.push({date:sd.value,buyer:sb.value,grade:sg.value,kg:k,gross:k*p,deduct:+sx.value||0});save()}
function expense(){let a=+ea.value;if(!a)return alert("Enter amount");d.exp.push({date:ed.value,cat:ec.value,amount:a,note:en.value});save()}
function table(id,head,rows){document.getElementById(id).innerHTML="<table><tr>"+head.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")+"</table>"}
function render(){let cb=d.buy.filter(x=>x.type=="Cherry").reduce((a,x)=>a+x.kg,0),sp=d.buy.reduce((a,x)=>a+x.total,0),pa=d.proc.reduce((a,x)=>a+x.parchment,0),sr=d.sale.reduce((a,x)=>a+x.gross-x.deduct,0),ex=d.exp.reduce((a,x)=>a+x.amount,0)+d.proc.reduce((a,x)=>a+x.bonus,0);ch.textContent=cb+" kg";sp.textContent=money(sp);document.getElementById("pa").textContent=pa+" kg";sa.textContent=money(sr);document.getElementById("ex").textContent=money(ex);net.textContent=money(sr-sp-ex);
table("btbl",["Date","Seller","Type","Kg","Price","Total"],d.buy.map(x=>[x.date,x.seller,x.type,x.kg,money(x.price),money(x.total)]));
table("ptbl",["Date","Batch","Cherry","Parchment","Sunk","Float","Moisture","Bonus"],d.proc.map(x=>[x.date,x.batch,x.cherry,x.parchment,x.sunk,x.float,x.moisture+"%",money(x.bonus)]));
table("stbl",["Date","Buyer","Grade","Kg","Gross","Deduct","Net"],d.sale.map(x=>[x.date,x.buyer,x.grade,x.kg,money(x.gross),money(x.deduct),money(x.gross-x.deduct)]));
table("etbl",["Date","Category","Amount","Notes"],d.exp.map(x=>[x.date,x.cat,money(x.amount),x.note]));
let c=d.proc.reduce((a,x)=>a+x.cherry,0),p=d.proc.reduce((a,x)=>a+x.parchment,0);report.innerHTML=c?`Actual cherry → parchment yield: <b>${(p/c*100).toFixed(2)}%</b> (${c} kg → ${p} kg).<br>Worker coffee bonuses: <b>${money(d.proc.reduce((a,x)=>a+x.bonus,0))}</b>`:"Add processing batches to see your conversion."}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="coffee-backup.json";a.click()}
[["dashboard","🏠 Dashboard"],["buying","🛒 Buying"],["processing","🌱 Processing"],["sales","💰 Sales"],["expenses","💵 Expenses"],["reports","📊 Reports"]].forEach((x,i)=>{let b=document.createElement("button");b.textContent=x[1];b.onclick=()=>{document.querySelectorAll(".sec").forEach(s=>s.classList.remove("show"));document.getElementById(x[0]).classList.add("show");document.querySelectorAll("nav button").forEach(z=>z.classList.remove("active"));b.classList.add("active")};nav.appendChild(b);if(i==0)b.classList.add("active")});
["bd","pd","sd","ed"].forEach(x=>document.getElementById(x).value="2026-10-01");render();
let deferredPrompt=null;const installBtn=document.getElementById("installBtn");window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display="inline-block"});installBtn.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display="none"});window.addEventListener("appinstalled",()=>{installBtn.style.display="none"});if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
